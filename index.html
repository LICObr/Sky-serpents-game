<html lang="pt-BR">
<head>

  <!-- Ícones: aba do navegador e atalho na tela do celular (tools/favicon.py) -->
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icones/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icones/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icones/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <style>

<body>
  <!--
    A ORDEM dos scripts importa: cada arquivo só pode usar classes que foram
    carregadas antes dele (principalmente a classe "pai" de uma herança).

    Estrutura de src/:
      config/      configurações (personagens, bichos, chefões, terrenos...)
      levels/      as FASES (uma por arquivo) e a lista da campanha
      core/        utilitários, classe base GameEntity, combate
      ui/          interface (HUD, menu, telas)
      world/       cenário (mapa, fundo, efeitos, música)
      projectiles/ base dos projéteis + bolas de fogo dos chefões
      player/      base do jogador
        knight/    tudo do GUERREIRO (espada)
        archer/    tudo da ARQUEIRA (arco, flechas)
      enemies/     bichos pequenos
      bosses/      base dos chefões (e o que cai do teto: gelo, mel)
        dragon/    tudo dos DRAGÕES (vermelho e rosa)
        serpent/   tudo da SERPENTE GLACIAL
        bear/      tudo do URSO POLAR
        hive/      a COLMEIA (fase 5)
        bee/       a ABELHA RAINHA (fase 5)
        eaglet/    o FILHOTE DE ÁGUIA (fase 6)
      items/       poções e moedas
      scenes/      carregamento, menus (principal, opções, personagem, fases), fase e pausa
      main.js      inicia o Phaser
  -->
